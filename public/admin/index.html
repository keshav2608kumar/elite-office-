<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Elite Office Technologies</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-login-body">
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div style="text-align:center; margin-bottom: 20px;">
                <img src="/images/logo.png" alt="Elite Office Technologies" style="max-width: 250px; border-radius: 8px;">
            </div>
            <h2 class="admin-subtitle">Admin Portal</h2>
            
            <form id="admin-login-form" autocomplete="off">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="password-toggle" id="toggle-password">Show</button>
                    </div>
                </div>
                <div id="login-error" class="error-message hidden"></div>
                <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                    <span class="btn-text">Log In</span>
                    <span class="btn-loader hidden">Loading...</span>
                </button>
            </form>
            <a href="../index.html" class="back-link">Return to Main Site</a>
        </div>
    </div>
    
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/admin/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (AdminAuth.refreshToken) {
                try {
                    await AdminAuth.refresh();
                    window.location.href = 'dashboard.html';
                } catch (e) {}
            }

            const form = document.getElementById('admin-login-form');
            const errorDiv = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoader = btn.querySelector('.btn-loader');
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');

            togglePassword.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePassword.textContent = 'Hide';
                } else {
                    passwordInput.type = 'password';
                    togglePassword.textContent = 'Show';
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                btn.disabled = true;
                btnText.classList.add('hidden');
                btnLoader.classList.remove('hidden');
                errorDiv.classList.add('hidden');
                errorDiv.textContent = '';
                
                try {
                    await AdminAuth.login(email, password);
                    window.location.href = 'dashboard.html';
                } catch (err) {
                    errorDiv.textContent = err.message || 'Login failed. Please try again.';
                    errorDiv.classList.remove('hidden');
                } finally {
                    btn.disabled = false;
                    btnText.classList.remove('hidden');
                    btnLoader.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
